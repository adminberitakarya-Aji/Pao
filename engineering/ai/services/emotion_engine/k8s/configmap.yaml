apiVersion: v1
kind: ConfigMap
metadata:
  name: emotion-engine-config
  namespace: pao-emotion-engine
  labels:
    app.kubernetes.io/name: emotion-engine
    app.kubernetes.io/part-of: pao-ai
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  APPRAISAL_MODEL_NAME: "j-hartmann/emotion-english-distilroberta-base"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  DATABASE_POOL_TIMEOUT: "30"
  STATE_TTL_SECONDS: "3600"
  STATE_CLEANUP_INTERVAL_SECONDS: "300"
  CALIBRATION_MIN_SAMPLES: "10"
  CALIBRATION_WINDOW_SIZE: "100"
  CALIBRATION_DRIFT_THRESHOLD: "0.15"
  METRICS_ENABLED: "true"