apiVersion: v1
kind: Service
metadata:
  name: emotion-engine
  namespace: pao-emotion-engine
  labels:
    app.kubernetes.io/name: emotion-engine
    app.kubernetes.io/part-of: pao-ai
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  selector:
    app.kubernetes.io/name: emotion-engine