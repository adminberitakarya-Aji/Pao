apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: emotion-engine
  namespace: pao-emotion-engine
  labels:
    app.kubernetes.io/name: emotion-engine
    app.kubernetes.io/part-of: pao-ai
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: emotion-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - pao-emotion-engine