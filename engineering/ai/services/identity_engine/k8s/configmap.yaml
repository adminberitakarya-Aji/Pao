apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-engine-config
  namespace: ai-services
data:
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8003"
  WORKERS: "4"
  # Redis
  REDIS_MAX_CONNECTIONS: "50"
  REDIS_SOCKET_TIMEOUT: "5"
  REDIS_SOCKET_CONNECT_TIMEOUT: "5"
  # Database
  DB_POOL_MIN_SIZE: "5"
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_TIMEOUT: "30"
  # Fingerprint
  FINGERPRINT_DIMENSION: "768"
  FINGERPRINT_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  # Drift
  DRIFT_CHECK_INTERVAL_HOURS: "24"
  DRIFT_BASELINE_WINDOW_DAYS: "30"
  DRIFT_SEVERITY_THRESHOLDS: '{"minimal": 0.1, "moderate": 0.25, "significant": 0.4, "critical": 0.6}'
  # Evolution
  EVOLUTION_AUTO_APPROVE: "false"
  EVOLUTION_REQUIRED_APPROVALS: "2"
  EVOLUTION_MAX_PROPOSALS_PER_PERIOD: "5"
  EVOLUTION_PERIOD_DAYS: "30"