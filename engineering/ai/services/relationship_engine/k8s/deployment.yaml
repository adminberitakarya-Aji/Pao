apiVersion: apps/v1
kind: Deployment
metadata:
  name: relationship-engine-api
  namespace: relationship-engine
  labels:
    app.kubernetes.io/name: relationship-engine-api
    app.kubernetes.io/part-of: pao-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relationship-engine-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relationship-engine-api
        app.kubernetes.io/part-of: pao-platform
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: relationship-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: relationship-engine:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: relationship-engine-config
            - secretRef:
                name: relationship-engine-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@relationship-engine-postgres:5432/relationship_engine"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@relationship-engine-redis:6379/0"
            - name: KUZU_URL
              value: "kuzu://relationship-engine-kuzu:8000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/relationship/health/live
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/relationship/health/ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/relationship/health/live
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relationship-engine-worker
  namespace: relationship-engine
  labels:
    app.kubernetes.io/name: relationship-engine-worker
    app.kubernetes.io/part-of: pao-platform
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relationship-engine-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relationship-engine-worker
        app.kubernetes.io/part-of: pao-platform
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: relationship-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: relationship-engine-worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: relationship-engine-config
            - secretRef:
                name: relationship-engine-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@relationship-engine-postgres:5432/relationship_engine"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@relationship-engine-redis:6379/0"
            - name: KUZU_URL
              value: "kuzu://relationship-engine-kuzu:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"