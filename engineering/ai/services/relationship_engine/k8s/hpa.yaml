apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relationship-engine-api-hpa
  namespace: relationship-engine
  labels:
    app.kubernetes.io/name: relationship-engine-api
    app.kubernetes.io/part-of: pao-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relationship-engine-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relationship-engine-worker-hpa
  namespace: relationship-engine
  labels:
    app.kubernetes.io/name: relationship-engine-worker
    app.kubernetes.io/part-of: pao-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relationship-engine-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60