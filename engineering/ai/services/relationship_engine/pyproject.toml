[project]
name = "relationship_engine"
version = "0.1.0"
description = "Relationship Engine - Tracks relationship dimensions, milestones, diary, and state machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pao-shared @ file://../../shared",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.35",
    "redis==5.1.1",
    "kuzu==0.2.4",
    "httpx==0.28.1",
    "python-json-logger==2.0.7",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.28.0",
    "opentelemetry-sdk==1.28.0",
    "opentelemetry-exporter-otlp==1.28.0",
    "opentelemetry-instrumentation-fastapi==0.49b0",
    "opentelemetry-instrumentation-asyncpg==0.49b0",
    "opentelemetry-instrumentation-redis==0.49b0",
    "opentelemetry-instrumentation-httpx==0.49b0",
    "tenacity==8.5.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "faker==25.7.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[tool.uv.sources]
pao-shared = { workspace = true, editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH", "T20", "SIM", "RET"]
ignore = ["S101", "T201"]
per-file-ignores = {
    "tests/*": ["S101", "T201"],
    "scripts/*": ["S101", "T201"],
}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
ignore_missing_imports = true