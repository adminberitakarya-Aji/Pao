[project]
name = "proactive-engine"
version = "0.1.0"
description = "PAO Proactive Engine - Proactive behavior, initiative, and anticipation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PAO Team", email = "team@pao.ai"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.10.*",
    "pydantic-settings==2.6.*",
    "structlog==25.1.*",
    "python-json-logger==2.0.*",
    "prometheus-client==0.21.*",
    "httpx==0.28.*",
    "redis==5.2.*",
    "numpy==2.1.*",
    "scipy==1.14.*",
    "scikit-learn==1.5.*",
    "transformers==4.45.*",
    "torch==2.5.*",
    "onnxruntime==1.20.*",
    "sentence-transformers==3.2.*",
    "apscheduler==3.10.*",
    "pydantic-extra-types==2.10.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==6.0.*",
    "httpx==0.28.*",
    "ruff==0.7.*",
    "mypy==1.13.*",
    "pre-commit==3.8.*",
]

[build-system]
requires = ["setuptools>=75.6", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PL", "ARG", "PTH", "ERA", "PD", "RSE", "RET", "TRY", "NPY", "FA", "LOG"]
ignore = ["S101", "PLW0603", "T201", "ARG001", "ARG002"]
per-file-ignores = {"tests/*": ["S101", "T201"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
include = ["proactive_engine*"]