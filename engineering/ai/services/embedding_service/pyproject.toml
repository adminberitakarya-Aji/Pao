[project]
name = "pao-embedding-service"
version = "1.0.0"
description = "PAO Embedding Service - Vector Embeddings Generation"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "PAO Engineering", email = "engineering@pao.app"}
]
dependencies = [
    "pao-shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
format = {quote-style = "double", indent-style = "space"}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true